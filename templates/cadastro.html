<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don'Raville - Cadastro</title>
    <link rel="stylesheet" href="../estilos/cadastro.css">
</head>
<body>

<header>
    <div class="logo-container">
        <h1>Pizzaria Don'Raville</h1>
    </div>
    <nav class="nav-links">
        <a href="../index.html">← Voltar ao Iinicio</a>
    </nav>
</header>

<div class="main-container">
    <section class="form-section">
        <h2>Criar uma nova conta</h2>
        <!-- Como você está criando o backend, adicione a rota correspondente no 'action' -->
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" name="name" placeholder="Ex: João Silva" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Celular / WhatsApp</label>
                <input type="tel" id="reg-phone" name="phone" placeholder="(00) 99999-9999" required>
            </div>
            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Crie uma Senha</label>
                <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn-submit">Cadastrar e Escolher Pizza</button>
        </form>
        <p class="switch-link">Já tem conta? <a href="login.html">Entre aqui</a></p>
    </section>
</div>

<footer>
    <p>© 2026 Pizzaria Don'Raville. Pronto para acoplamento com rotas de Back-end.</p>
</footer>

</body>
</html>
