<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don'Raville - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fdfbf7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #2c2c2c;
            color: #fff;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container h1 {
            color: #e28743;
            font-size: 22px;
            font-weight: 700;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #e28743;
        }

        .main-container {
            max-width: 450px;
            width: 100%;
            margin: 60px auto;
            padding: 0 20px;
        }

        .form-section {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 4px solid #b73e23;
        }

        .form-section h2 {
            font-size: 22px;
            color: #2c2c2c;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #b73e23;
        }

        .btn-submit {
            background-color: #b73e23;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #96321b;
        }

        .switch-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #555;
        }

        .switch-link a {
            color: #b73e23;
            font-weight: 600;
            text-decoration: none;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #2c2c2c;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <h1>Pizzaria Don'Raville</h1>
    </div>
    <nav class="nav-links">
        <a href="/index.html">← Voltar ao Inicio</a>
    </nav>
</header>

<div class="main-container">
    <section class="form-section">
        <h2>Já tenho cadastro</h2>
        <!-- Como você está criando o backend, adicione a rota correspondente no 'action' -->
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Senha</label>
                <input type="password" id="login-password" name="password" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-submit">Entrar e Continuar Pedido</button>
        </form>
        <p class="switch-link">Não tem conta? <a href="/templates/cadastro.html">Cadastre-se aqui</a></p>
    </section>
</div>

<footer>
    <p>© 2026 Pizzaria Don'Raville. Pronto para acoplamento com rotas de Back-end.</p>
</footer>

</body>
</html>
