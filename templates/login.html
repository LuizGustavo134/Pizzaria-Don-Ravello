<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don'Raville - Login</title>
    <link rel="stylesheet" href="../estilos/login.css">
</head>
<body>

<header>
    <div class="logo-container">
        <h1>Pizzaria Don'Raville</h1>
    </div>
    <nav class="nav-links">
        <a href="../index.html">← Voltar ao Inicio</a>
    </nav>
</header>

<div class="main-container auth-container">
    <div class="login-box">
        <div class="wrapper">
            <div class="card-switch">
                <div class="switch">
                    <input class="toggle" type="checkbox" aria-label="Alternar entre login e cadastro">

                    <div class="flip-card__inner">
                        <div class="flip-card__front">
                            <div class="title">Login</div>
                            <form action="/login" method="POST" class="flip-card__form">
                                <input type="email" placeholder="E-mail" name="email" class="flip-card__input" required>
                                <input type="password" placeholder="Senha" name="password" class="flip-card__input" required>
                                <button type="submit" class="flip-card__btn">Entrar</button>
                            </form>
                        </div>

                        <div class="flip-card__back">
                            <div class="title">Cadastro</div>
                            <form action="/register" method="POST" class="flip-card__form">
                                <input type="text" placeholder="Nome" name="name" class="flip-card__input" required>
                                <input type="email" placeholder="E-mail" name="email" class="flip-card__input" required>
                                <input type="password" placeholder="Senha" name="password" class="flip-card__input" required>
                                <button type="submit" class="flip-card__btn">Entrar &amp; Cadastrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flip-switch-container">
            <div class="flip-switch">
                <input type="radio" id="switch-opt-1" name="flip-switch" value="login" checked onchange="alternarModoAuth(this.value)" />
                <input type="radio" id="switch-opt-2" name="flip-switch" value="cadastro" onchange="alternarModoAuth(this.value)" />

                <label for="switch-opt-1" class="switch-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"></path>
                    </svg>
                    <span>Entrar</span>
                </label>

                <label for="switch-opt-2" class="switch-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
                    </svg>
                    <span>Cadastrar</span>
                </label>

                <div class="switch-card">
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Pizzaria Don'Raville. Pronto para acoplamento com rotas de Back-end.</p>
</footer>

<script src="../scripts/login.js"></script>
</body>
</html>
